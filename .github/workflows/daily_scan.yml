name: Daily Stock Scan

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '30 19 * * *' # Runs at 19:30 UTC, which is 1:00 AM IST

concurrency:
  group: daily-stock-scan
  cancel-in-progress: false

jobs:
  run-scan:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    permissions:
      contents: write # <-- This line grants permission to commit files
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11' # Using a recent Python version
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the V1 stock scanner (primary)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python multibagger.py

      - name: Commit and push the V1 result
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add penny_stock_scores_*.csv
          if git diff --staged --quiet; then
            echo "No V1 changes to commit."
          else
            git commit -m "Automated daily V1 stock scan results"
            git push
          fi

      - name: Run the V2 stock scanner (supplemental)
        id: v2_scan
        continue-on-error: true
        run: |
          python multibagger_v2.py \
            --equity-file EQUITY_L.csv \
            --skip-equity-download \
            --price-threshold 25 \
            --candidate-score 50 \
            --output "v2data/multibagger_v2_scores_$(date -u +'%d_%m_%y').csv"

      - name: Report a supplemental V2 failure
        if: steps.v2_scan.outcome == 'failure'
        run: echo "::warning title=V2 scan failed::The primary V1 result was already committed."

      - name: Commit and push the V2 result
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add v2data/
          if git diff --staged --quiet; then
            echo "No V2 changes to commit."
          else
            git commit -m "Automated daily V2 stock scan results"
            git push
          fi
